name: .NET CI

on:
  push:
    branches:
      - main
      - audit/**
      - feature/**
  pull_request:
    branches:
      - main

jobs:
  backend:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore dependencies
        run: dotnet restore ./src/backend/Biogarden.sln --locked-mode

      - name: Audit backend dependencies
        run: dotnet list ./src/backend/Biogarden.sln package --vulnerable --include-transitive

      - name: Build solution
        run: dotnet build ./src/backend/Biogarden.sln --no-restore --configuration Release

      - name: Verify backend formatting
        run: dotnet format ./src/backend/Biogarden.sln --verify-no-changes --no-restore

      - name: Run tests
        run: dotnet test ./src/backend/Biogarden.sln --no-build --configuration Release --verbosity normal

  backend-integration:
    runs-on: ubuntu-latest
    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: Y
          MSSQL_SA_PASSWORD: IntegrationTestsOnly_2026!
        ports:
          - 1433:1433
        options: >-
          --health-cmd="/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P IntegrationTestsOnly_2026! -C -Q 'SELECT 1' -b"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=20
          --health-start-period=20s
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore dependencies
        run: dotnet restore ./src/backend/Biogarden.sln --locked-mode

      - name: Run SQL Server integration tests
        env:
          BIOGARDEN_TEST_SQLSERVER: 'Server=localhost,1433;User Id=sa;Password=IntegrationTestsOnly_2026!;TrustServerCertificate=True'
        run: dotnet test ./src/backend/tests/Biogarden.WebApi.Tests --configuration Release --no-restore --filter Category=SqlServer --logger "trx;LogFileName=sqlserver.trx"

      - name: Setup Node.js for real browser journeys
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ./src/frontend/biogarden-client/package-lock.json

      - name: Install real browser test dependencies
        working-directory: ./src/frontend/biogarden-client
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Run real browser-to-database journeys
        env:
          BIOGARDEN_TEST_SQLSERVER: 'Server=localhost,1433;User Id=sa;Password=IntegrationTestsOnly_2026!;TrustServerCertificate=True'
          BIOGARDEN_REAL_BROWSER: '1'
        run: dotnet test ./src/backend/tests/Biogarden.WebApi.Tests --configuration Release --no-build --no-restore --filter Category=RealBrowser --logger "trx;LogFileName=real-browser.trx"

      - name: Upload real browser failure traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: real-browser-traces
          path: src/frontend/biogarden-client/test-results/

      - name: Upload integration test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sqlserver-test-results
          path: src/backend/tests/Biogarden.WebApi.Tests/TestResults/*.trx

  frontend:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./src/frontend/biogarden-client

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ./src/frontend/biogarden-client/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Audit frontend dependencies
        run: npm audit --audit-level=moderate

      - name: Install Playwright browsers
        run: npx playwright install chromium

      - name: Lint frontend
        run: npm run lint

      - name: Typecheck frontend
        run: npm run typecheck

      - name: Build frontend
        run: npm run build

      - name: Verify SEO files
        run: npm run verify:seo

      - name: Run E2E tests
        run: npm run test:e2e
