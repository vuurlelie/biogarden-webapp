name: .NET CI

on:
  push:
    branches:
      - main
      - audit/**
      - feature/**
  pull_request:
    branches:
      - main

jobs:
  backend:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Restore dependencies
        run: dotnet restore ./src/backend/Biogarden.sln

      - name: Build solution
        run: dotnet build ./src/backend/Biogarden.sln --no-restore --configuration Release

      - name: Run tests
        run: dotnet test ./src/backend/Biogarden.sln --no-build --configuration Release --verbosity normal

  frontend:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./src/frontend/biogarden-client

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ./src/frontend/biogarden-client/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install chromium

      - name: Lint frontend
        run: npm run lint

      - name: Build frontend
        run: npm run build

      - name: Run E2E tests
        run: npm run test:e2e
