name: .NET CI

on:
  push:
    branches:
      - main
      - feature/**
  pull_request:
    branches:
      - main

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Restore dependencies
        run: dotnet restore ./src/backend/Biogarden.sln

      - name: Build solution
        run: dotnet build ./src/backend/Biogarden.sln --no-restore --configuration Release

      - name: Run tests
        run: dotnet test ./src/backend/Biogarden.sln --no-build --configuration Release --verbosity normal